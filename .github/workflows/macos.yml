name: macOS validation
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: |
          brew install ffmpeg-full deno
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_environment.py
      - run: python -m pytest -q --junitxml=test-results/macos.xml
      - name: Report failed checks
        if: always()
        run: python scripts/ci_test_report.py
      - run: node tests/check_ui.mjs
      - run: python -m PyInstaller --noconfirm KadroGen-macOS.spec
      - name: Archive app (preserve bundle permissions)
        run: ditto -c -k --sequesterRsrc --keepParent dist/KadroGen.app dist/KadroGen-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KadroGen-macOS-arm64
          path: dist/KadroGen-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-test-results
          path: test-results/
