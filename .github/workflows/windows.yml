name: Windows build
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install native tools using Chocolatey's verified packages
        shell: powershell
        run: |
          choco install ffmpeg deno --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency installation failed.' }
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check interface scripts
        run: node tests/check_ui.mjs
      - name: Test and build Windows application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python
      - name: Report failed checks
        if: always()
        run: python scripts/ci_test_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: KadroGen-Windows-x64
          path: dist/KadroGen-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results
          path: test-results/
